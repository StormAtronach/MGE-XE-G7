# MGE XE configuration
# Values omitted from a user file use these schema defaults.
# Saving an existing file inserts entries missing from it, comments included.
# Increment only for an intentionally incompatible schema revision.
schema_version = 3

# Display-device values are applied by the GUI/registry owner unless noted.
[graphics]
# Multisample level: none, x2, x4, or x8.
anti_aliasing = "none"
# Depth/stencil format requested from Direct3D.
z_buffer_format = "d24s8"
# Presentation interval: immediate, one, two, three, or four.
vsync = "immediate"
# Requested Hz; 0 lets Direct3D choose the default.
refresh_rate = 0
# Use a borderless window instead of decorated windowed mode.
borderless = true
# Texture anisotropy: off, x2, x4, x8, or x16.
anisotropy = "x8"
# Enable alpha-tested edge multisampling where supported.
transparency_antialiasing = true

# Renderer-wide settings. Time values are milliseconds unless stated.
[render]
# Horizontal field of view in degrees, clamped to 5..150.
fov = 75.0
# depth_pixel, depth_vertex, or range_vertex.
fog_mode = "range_vertex"
# Apply the configured post-processing shader chain (on in a new configuration, with the
# chain of the tests of the wgpu renderer in the shaders table).
enable_shaders = true
# Rebuild skinned meshes with an indexed bone palette, cutting the number of
# partition draws per actor. Requires the matching custom DXVK d3d9.dll; MGE XE
# falls back to stock skinning when it is absent. Read once at process start, so
# changing it takes effect after a full game restart.
indexed_skinning = false
# Render the near scene relative to the camera position, computed in double
# precision. Removes the shimmer of objects, terrain seams and the whole scene
# far from the world origin (province mods), where float32 world coordinates
# round by a visible amount. Read once at process start, so turning it on
# takes effect after a full game restart; turning it off applies from the
# next scene.
camera_relative = true
# HDR adaptation time in seconds, clamped to 0.01..30.
hdr_reaction_time = 2.0
# Draw MGE XE's FPS counter.
fps_counter = false
# Show MGE XE status messages.
messages = true
# Status-message lifetime, clamped to 1000..10000 ms.
message_timeout_ms = 2000
# bmp, jpeg, dds, png, or tga.
screenshot_format = "png"
# Empty means the Morrowind root.
screenshot_directory = ""
# Filename prefix; at most 31 runtime bytes.
screenshot_name = "Morrowind"
# timestamp, ordinal, character_ordinal, or character_game_time_ordinal.
screenshot_suffix = "timestamp"
# UI scale, clamped to 0.5..5.
ui_scale = 1.0
# Window placement alignment: left, center, or right.
window_align_x = "center"
window_align_y = "center"

# Startup gates and live runtime behavior.
[runtime]
# Disable MGE XE and use the system proxy path.
disabled = false
# Disable internal MWSE integration.
mwse_disabled = false
# Run only the D3D8-to-D3D9 proxy.
proxy_only = false
# Draw with the wgpu renderer of the helper process. MGE XE then makes no Direct3D device:
# the nirender plugin gives the game its Direct3D 8, and numidium.exe draws the picture.
# Set this to false to use MGE XE on Direct3D 9. MGE XE also uses Direct3D 9 when
# numidium.exe or MWSE.dll is not in the folder of the game.
renderer_wgpu = true
# The graphics API of the wgpu renderer: auto (the first choice for the machine), vulkan,
# or dx12. Read by numidium.exe when it starts; nirender-host.log names the one in use.
renderer_backend = "auto"
# The room for the textures of a frame of the wgpu renderer: 0 lets the renderer choose
# (what the graphics card allows, at most 16384), or the most slots, 256 to 1048576
# (another value counts as 0). A texture past a full room draws white, and
# nirender-host.log says so. Read by numidium.exe when it starts.
renderer_texture_slots = 0
# The frames of the wgpu renderer that may wait for the graphics card, 1 to 3. 1 gives the
# least lag of the mouse when the graphics card is the slow part, but the renderer and the
# card then take turns (a third fewer frames in a test with a fast card); 2 keeps both busy.
# Read by numidium.exe when it starts.
renderer_frame_latency = 2
# Skip intro movies.
skip_intro = true
# Cache menu backgrounds.
menu_caching = false
# Enable the custom third-person camera offsets.
custom_camera = false
# Camera offsets; X/Z clamp to ±250 and Y to ±2500.
camera_x = 0.0
camera_y = -160.0
camera_z = 0.0
# Hide the crosshair automatically when appropriate.
crosshair_autohide = false

# Core distant-land switches and distances in exterior cells.
[distant_land]
# A new configuration starts with distant land on (the settings of the tests of the wgpu
# renderer). The distant land must be generated once in the MGE XE GUI.
enabled = true
# Regenerate automatically when the saved generation job requires it (the load order, the
# generation settings, or the version of the data changed). The GUI saves the job when it
# generates.
automatic_rebuild = true
# The wgpu renderer: after a game load or a teleport (a door, a travel; it needs MWSE's
# native event 5), keep the loading screen until the distant statics around the player are on
# the GPU (at most 15 s), as MGE XE on Direct3D 9 does at the first load. Without it they fade
# in after the load.
wait_on_load = false
# Read the scene's real depth buffer instead of redrawing geometry to approximate
# it. Removes about half the depth pass, and fixes objects vanishing from
# distant-land scenes when they use multi-texturing effects such as darkmaps with
# transparency. Falls back to the old path wherever it cannot be used safely.
native_depth_capture = true
# Submit supported Morrowind per-pixel-lighting draws directly to DXVK. Also
# required for expanded_light_limit to reach per-pixel-lit objects.
native_ppl_packets = true
# Raise the engine's per-node local light limit from 8 to 32: fewer light seams
# between neighbouring meshes. The wgpu renderer always supports it. With
# Direct3D 9 it needs a renderer that reports the expanded limit (ignored
# otherwise), and with per-pixel lighting also native_ppl_packets set to true.
expanded_light_limit = true
# A new configuration starts with distant statics on.
statics = true
# Permit replacement water even when distant land is disabled.
water_without_land = true
# Render generated grass.
render_grass = true
# Overall and static-band distances, clamped to the schema ranges.
draw_distance = 7.0
near_static_end = 4.0
far_static_end = 4.69
very_far_static_end = 6.86
# Minimum model sizes used when classifying far static tiers.
far_static_min_size = 600.0
very_far_static_min_size = 800.0
# The wgpu renderer keeps the merged distant statics on the GPU under a limit that it
# takes from the memory budget of the GPU. When the GPU does not give a budget, this is
# the limit in megabytes; 0 is no limit.
statics_fallback_cap_mb = 1024
# The wgpu renderer: which merged distant statics stay on the GPU. "auto": they stay until
# their memory passes statics_resident_mb, then the ones wanted least recently go. "near":
# they go when the camera is farther than the draw distance and two cells. "all": all of
# them go to the GPU when they fit under statics_resident_mb, else as "auto".
statics_residency = "auto"
# The wgpu renderer: the most megabytes of merged distant statics that stay on the GPU;
# 0 is half of the room that the memory budget of the GPU leaves.
statics_resident_mb = 0
# Enable fixed-function replacement lighting and select its scope.
per_pixel_lighting = true
per_pixel_mode = "always"
# Fade each per-pixel point light to zero before a multiple of its radius,
# instead of letting it reach infinitely far. The fade covers the last
# quarter of that distance. 1.75 matches OpenMW. Lights are also attached to
# objects out to that distance, so they no longer pop on and off as actors
# and carried lights move. Works best with expanded_light_limit.
per_pixel_light_fade = true
per_pixel_light_fade_radius = 1.75
# The wgpu renderer lights each pixel with the lights of the game: each light with
# its own colour and its whole falloff. On: the lights as MGE XE on Direct3D 9
# decodes them (the linear part of the falloff dropped, some lights grey).
per_pixel_original_lights = false
# The wgpu renderer: a pixel takes its lights from the clusters of the view, with
# the mask of the lights of its draw. The picture is the same either way; they
# can pay with many lights for each object, and cost CPU time otherwise.
clustered_lights = false

# Water reflection, simulation, and effect strengths.
[distant_land.water]
reflect_land = true
reflect_near_statics = true
# The approved reset intentionally enables interior reflections.
reflect_interiors = true
reflect_sky = true
dynamic_ripples = false
blur_reflections = false
# With blur_reflections, in the wgpu renderer: a reflection is sharp where the thing meets the
# water, and its blur grows with the distance of the thing from the water. false gives the
# even blur of the Direct3D 9 renderer.
blur_contact_hardening = true
# Wave and caustics percentages, clamped to 0..250 and 0..100.
wave_height = 50
caustics_intensity = 50
# Water volumes among the distant statics reflect what is on screen out to this many cells from
# the eye. Farther away they reflect the sky only. 0 gives the sky only everywhere. 0..64.
volume_reflection_cells = 8.0
# Light on water volumes. Each is on by default; the water shading has no code for one that
# is off.
# The shadows of distant land fall on the surface: no glint of the sun in a shadow.
volume_shadows = true
# The lamps and fires of the game glint in the surface.
volume_point_lights = true
# The light pattern of ripples on what is under the surface, with the strength of
# caustics_intensity.
volume_caustics = true

# Fog modes and start/end distances in exterior cells.
[distant_land.fog]
exponential = true
atmosphere_scattering = true
above_water_start = 2.0
above_water_end = 5.0
below_water_start = -0.5
below_water_end = 0.3
interior_start = 0.0
interior_end = 2.0

# Grass behaviour that weather cannot decide.
[distant_land.grass]
# Constant wind for grass in interiors, which have no weather. Same units as
# the per-weather wind factors, clamped to 0..1; 0 leaves only the idle shimmer.
interior_wind = 0.075
# The looks of the grass shader of Remiros' Groundcover (wgpu renderer only).
# The grass sinks into the ground near the end of its range, at a distance that
# varies, so that it ends without a line.
soft_end = false
# The red of the vertex colour of a grass mesh weights its sway (a root that
# stays), and with wrap_lighting chooses the parts that get the wrap light.
vertex_color_sway = false
# The sun light wraps past the side of a blade, and some comes through from the
# back.
wrap_lighting = false

# Sun-shadow controls.
[distant_land.shadows]
enabled = true
# Runtime-supported map size, clamped to 1024..2048.
map_resolution = 2048

# Host-side terrain horizon culling. Distances here are world units.
[distant_land.horizon]
culling = true
height_bias = 512.0
object_bias = 256.0
near_exclude = 2048.0
ring_step = 4096.0
max_range = 49152.0
azimuth_bins = 512
sample_spacing = 512.0
adaptive_gate = true
rebuild_eye_threshold = 16.0
hierarchical_march = true

# Each weather table defines wind ratio, fog-distance ratio, and fog offset.
[distant_land.weather.clear]
wind = 0.1
fog_ratio = 1.0
fog_offset = 0.0
[distant_land.weather.cloudy]
wind = 0.2
fog_ratio = 0.9
fog_offset = 0.0
[distant_land.weather.foggy]
wind = 0.0
fog_ratio = 0.2
fog_offset = 30.0
[distant_land.weather.overcast]
wind = 0.2
fog_ratio = 0.7
fog_offset = 0.0
[distant_land.weather.rain]
wind = 0.3
fog_ratio = 0.5
fog_offset = 10.0
[distant_land.weather.thunderstorm]
wind = 0.5
fog_ratio = 0.5
fog_offset = 20.0
[distant_land.weather.ashstorm]
wind = 0.8
fog_ratio = 0.25
fog_offset = 45.0
[distant_land.weather.blight]
wind = 0.9
fog_ratio = 0.25
fog_offset = 50.0
[distant_land.weather.snow]
wind = 0.0
fog_ratio = 0.5
fog_offset = 40.0
[distant_land.weather.blizzard]
wind = 0.9
fog_ratio = 0.16
fog_offset = 100.0

# Per-pixel sun and ambient multipliers for each weather.
[lighting.weather.clear]
sun = 1.0
ambient = 1.0
[lighting.weather.cloudy]
sun = 1.0
ambient = 1.0
[lighting.weather.foggy]
sun = 1.0
ambient = 1.0
[lighting.weather.overcast]
sun = 1.0
ambient = 1.0
[lighting.weather.rain]
sun = 1.0
ambient = 1.0
[lighting.weather.thunderstorm]
sun = 1.0
ambient = 1.0
[lighting.weather.ashstorm]
sun = 1.0
ambient = 1.0
[lighting.weather.blight]
sun = 1.0
ambient = 1.0
[lighting.weather.snow]
sun = 1.0
ambient = 1.0
[lighting.weather.blizzard]
sun = 1.0
ambient = 1.0

# Ordered post-processing shader names. A new configuration starts with the chain of the
# tests of the wgpu renderer.
[shaders]
chain = ["SSAO Fast", "Sunshafts", "Bloom Fine"]

# Input data is structured TOML; the shared crate renders legacy runtime buffers.
[input]
# Sparse arrays use an explicit `index`; omitted slots remain unused.
macros = []
triggers = []
# Source-to-target DirectInput scan-code map.
remap = {}

# GUI-only presentation and derived-value controls.
[gui]
# Use the best supported system language, or set en, fr, pl, or ru explicitly.
language = "auto"
# Derive horizontal FOV from the selected aspect ratio.
match_fov_to_aspect_ratio = true
# Recalculate concrete static/fog distances when related controls change.
auto_distances = true
# 0 derives from draw distance; 1 derives from above-water fog end; 2 is 1 with
# every static tier held at the fog end so statics fade out instead of popping.
auto_distance_mode = 0
# Exponential fog distance multiplier, clamped to 2.5..5.
exponential_distance_multiplier = 4.0
