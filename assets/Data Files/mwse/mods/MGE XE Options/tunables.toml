# The parameters of the wgpu renderer that a person can change while the game runs, to find
# a good value by eye. This file is the one list of them:
# - the renderer (mgeHost64) has it built in, for the names, the ranges and the start values;
# - the parameters window of the MGE XE options reads it for its sliders (the row
#   "water (renderer)" of the shader list opens it). A post shader has a file of the same
#   form beside it: XEshaders/<name>.toml.
# A change of this file needs a new build of mgeHost64.exe: the two must have the same list.
#
# The values that a person sets are not saved. A value that is good goes into this file as
# the new start value.
#
# Each parameter: its name (the code of the renderer reads it by this name), a label and a
# text for the window, the start value, the least and the most value, and the step of the
# slider. Each key on a line of its own, a text between quotation marks.

[[parameter]]
name = "water.blur.angle"
label = "Reflection blur: angle"
about = "How wide a point of the water mirrors, in radians, without wind. Only for the blur that is sharp at the waterline."
start = 0.004
least = 0.0
most = 0.05
step = 0.0005

[[parameter]]
name = "water.blur.wind"
label = "Reflection blur: wind"
about = "How much the wind adds to the angle."
start = 0.18
least = 0.0
most = 2.0
step = 0.02

[[parameter]]
name = "water.blur.stretch"
label = "Reflection blur: stretch"
about = "The most that the blur is taller than wide, for a flat look at the water."
start = 2.0
least = 1.0
most = 6.0
step = 0.1

[[parameter]]
name = "water.light.colour"
label = "Light under water: colour"
about = "How much faster a glow under water loses the colours that the water has less of. 1 follows the fog colour only; more makes the glow take the colour of the water sooner."
start = 3.0
least = 1.0
most = 8.0
step = 0.1

[[parameter]]
name = "lights.glow.size"
label = "Distant lights: glow size"
about = "The size of the glow of a distant light, as a part of the radius of the light."
start = 1.2
least = 0.1
most = 3.0
step = 0.05

[[parameter]]
name = "lights.glow.strength"
label = "Distant lights: glow strength"
about = "How bright the glow of a distant light is at night."
start = 2.5
least = 0.0
most = 6.0
step = 0.1

[[parameter]]
name = "lights.glow.pixels"
label = "Distant lights: least glow size"
about = "The least size of a glow on the screen, in pixels: a far light stays a point."
start = 3.0
least = 1.0
most = 8.0
step = 0.25

[[parameter]]
name = "lights.baked.strength"
label = "Distant lights: light on the land"
about = "How strong the baked light of the distant lights is on the land and the statics at night."
start = 1.0
least = 0.0
most = 4.0
step = 0.1
