cargo-features = ["per-package-target"]

# The tests of MGE XE's log (d3d8/cpp/support/log.cpp), compiled as the d3d8 crate compiles it.
[package]
name = "log-test"
version = "0.1.0"
edition = "2024"
publish = false
# 32-bit only; see the note in d3d8/crates/config-contract-test/Cargo.toml.
forced-target = "i686-pc-windows-msvc"

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
